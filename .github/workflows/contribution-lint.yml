# THE CONTRIBUTION LINT on every pull request (Rootstock, kit v1.49, NS-38 phase 1).
# PURPOSE: run reference tools/contribution_lint.py against the files a pull
#   request changes, so a contribution outside community/inbox/, a non-text
#   file, a shell-shaped line, an off-allowlist URL or an instruction aimed
#   at a reading Claude never merges; the owner's own pushes pass untouched.
# INTENT: Mazhron 2026-10-13: "we must ensure that no user could pull code
#   and be forced to run it."
# Search keys: contribution lint, pull request check, community gate, CI.
# See also: reference tools/contribution_lint.py; community/README.md.
name: contribution-lint

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contribution-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint the changed files
        run: python "reference tools/contribution_lint.py" --base "origin/${{ github.base_ref }}" --actor "${{ github.actor }}" --owner "${{ github.repository_owner }}"
